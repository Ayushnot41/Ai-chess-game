<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="420">
  <defs>
    <style>
      @keyframes floatKing {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-14px) rotate(1.5deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      @keyframes floatKnight {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(-2deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      @keyframes pulseGlow {
        0% { opacity: 0.35; filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.4)); }
        50% { opacity: 0.95; filter: drop-shadow(0 0 28px rgba(56, 189, 248, 1)); }
        100% { opacity: 0.35; filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.4)); }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes beamScan {
        0% { transform: translateX(-300px); opacity: 0; }
        20% { opacity: 0.7; }
        80% { opacity: 0.7; }
        100% { transform: translateX(1300px); opacity: 0; }
      }
      @keyframes dashMove {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -40; }
      }
      @keyframes beaconPing {
        0% { r: 6; opacity: 1; stroke-width: 2; }
        100% { r: 26; opacity: 0; stroke-width: 1; }
      }
      @keyframes tilePulse {
        0% { fill-opacity: 0.4; }
        50% { fill-opacity: 0.9; }
        100% { fill-opacity: 0.4; }
      }
      .floating-king { animation: floatKing 4.5s ease-in-out infinite; transform-origin: 240px 210px; }
      .floating-knight { animation: floatKnight 3.6s ease-in-out infinite reverse; transform-origin: 140px 240px; }
      .pulsing-aura { animation: pulseGlow 3s ease-in-out infinite; }
      .radar-sweep { animation: radarSweep 8s linear infinite; transform-origin: 240px 210px; }
      .scanline { animation: beamScan 5s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      .tactical-arc { animation: dashMove 1.5s linear infinite; stroke-dasharray: 6 4; }
      .beacon-ring { animation: beaconPing 2s cubic-bezier(0, 0.2, 0.8, 1) infinite; transform-origin: 320px 190px; }
      .target-tile { animation: tilePulse 2.5s ease-in-out infinite; }
    </style>

    <!-- Deep Space Background Gradient -->
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="35%" stop-color="#0b1329" />
      <stop offset="70%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Piece Shading Gradients -->
    <linearGradient id="goldSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="85%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <linearGradient id="cyanSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="85%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <linearGradient id="emeraldSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="40%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <linearGradient id="laserSheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Isometric Diamond Filter -->
    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Surface with Rounded Luxury Glass Border -->
  <rect width="1200" height="420" rx="20" fill="url(#cyberBg)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="2"/>

  <!-- Scanning Motion Laser Beam -->
  <rect class="scanline" y="0" width="220" height="420" fill="url(#laserSheen)" />

  <!-- Grid Starfield Elements -->
  <g opacity="0.25">
    <circle cx="80" cy="60" r="1.5" fill="#38bdf8"/>
    <circle cx="220" cy="40" r="1.5" fill="#38bdf8"/>
    <circle cx="540" cy="380" r="1.5" fill="#10b981"/>
    <circle cx="820" cy="70" r="2" fill="#fbbf24"/>
    <circle cx="1120" cy="180" r="1.5" fill="#38bdf8"/>
    <circle cx="1060" cy="360" r="2" fill="#a855f7"/>
  </g>

  <!-- 3D ISOMETRIC CHESSBOARD STAGE -->
  <g transform="translate(60, 40)">
    <!-- Radar Telemetry Grid -->
    <circle cx="240" cy="210" r="150" fill="none" stroke="rgba(56, 189, 248, 0.12)" stroke-dasharray="4,8"/>
    <circle cx="240" cy="210" r="100" fill="none" stroke="rgba(56, 189, 248, 0.18)" stroke-dasharray="2,6"/>
    <line class="radar-sweep" x1="240" y1="210" x2="390" y2="210" stroke="rgba(16, 185, 129, 0.55)" stroke-width="2" />

    <!-- Isometric Slab Base (Depth Extrusion) -->
    <polygon points="240,70 400,160 240,250 80,160" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <polygon points="240,250 400,160 400,185 240,275" fill="#0f172a" />
    <polygon points="240,250 80,160 80,185 240,275" fill="#090d16" />

    <!-- Isometric Tiles (4x4 Grid Segment) -->
    <!-- Rank 4 -->
    <polygon points="240,70 280,92.5 240,115 200,92.5" fill="#334155" opacity="0.65"/>
    <polygon points="280,92.5 320,115 280,137.5 240,115" fill="#1e293b" opacity="0.85"/>
    <polygon points="320,115 360,137.5 320,160 280,137.5" fill="#334155" opacity="0.65"/>
    <polygon points="360,137.5 400,160 360,182.5 320,160" fill="#1e293b" opacity="0.85"/>

    <!-- Rank 3 -->
    <polygon points="200,92.5 240,115 200,137.5 160,115" fill="#1e293b" opacity="0.85"/>
    <polygon points="240,115 280,137.5 240,160 200,137.5" fill="#334155" opacity="0.65"/>
    <polygon points="280,137.5 320,160 280,182.5 240,160" fill="#1e293b" opacity="0.85"/>
    <polygon points="320,160 360,182.5 320,205 280,182.5" fill="#334155" opacity="0.65"/>

    <!-- Rank 2 (Tactical Zone) -->
    <polygon points="160,115 200,137.5 160,160 120,137.5" fill="#334155" opacity="0.65"/>
    <polygon points="200,137.5 240,160 200,182.5 160,160" fill="#1e293b" opacity="0.85"/>
    <!-- Glowing Best-Move Destination Tile -->
    <polygon class="target-tile" points="240,160 280,182.5 240,205 200,182.5" fill="#10b981" stroke="#34d399" stroke-width="2"/>
    <polygon points="280,182.5 320,205 280,227.5 240,205" fill="#1e293b" opacity="0.85"/>

    <!-- Rank 1 -->
    <polygon points="120,137.5 160,160 120,182.5 80,160" fill="#1e293b" opacity="0.85"/>
    <polygon points="160,160 200,182.5 160,205 120,182.5" fill="#334155" opacity="0.65"/>
    <polygon points="200,182.5 240,205 200,227.5 160,205" fill="#1e293b" opacity="0.85"/>
    <polygon points="240,205 280,227.5 240,250 200,227.5" fill="#334155" opacity="0.65"/>

    <!-- Parabolic Move Arc (Knight e5 -> f7) -->
    <path class="tactical-arc" d="M 140,220 Q 190,120 240,180" fill="none" stroke="#38bdf8" stroke-width="3" />
    <polygon points="238,175 245,183 234,185" fill="#38bdf8" />

    <!-- Animated 3D Staunton King (Turned Profile on Center Diamond) -->
    <g class="floating-king">
      <!-- Contact Shadow -->
      <ellipse cx="240" cy="165" rx="26" ry="11" fill="#000000" opacity="0.55"/>
      <!-- Glowing Radial Aura -->
      <circle class="pulsing-aura" cx="240" cy="120" r="34" fill="url(#goldSheen)" filter="url(#glowFilter)"/>
      <!-- Staunton King Body Silhouette with Gradients -->
      <path d="M 224,142 C 224,136 228,132 233,130 C 230,124 231,114 234,107 C 230,105 228,100 231,96 C 233,93 237,92 240,94 C 243,92 247,93 249,96 C 252,100 250,105 246,107 C 249,114 250,124 247,130 C 252,132 256,136 256,142 Z" fill="url(#goldSheen)" stroke="#fef08a" stroke-width="1.2"/>
      <!-- Royal Cross Finial -->
      <line x1="240" y1="84" x2="240" y2="93" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="236" y1="88" x2="244" y2="88" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
      <!-- Luxury Monogram Glyphs -->
      <text x="240" y="128" font-family="'Cinzel', serif" font-size="20" font-weight="900" fill="#78350f" text-anchor="middle">♔</text>
    </g>

    <!-- Animated 3D Knight (Aggressive Tactical Outpost) -->
    <g class="floating-knight">
      <ellipse cx="140" cy="225" rx="18" ry="9" fill="#000000" opacity="0.45"/>
      <circle class="pulsing-aura" cx="140" cy="195" r="22" fill="url(#cyanSheen)" opacity="0.8"/>
      <!-- Knight Horse Head Mesh -->
      <path d="M 132,212 C 128,206 128,198 132,192 C 130,188 132,182 136,180 C 138,174 144,172 147,175 C 149,179 146,185 149,188 C 151,192 148,202 146,206 C 148,209 146,212 142,212 Z" fill="url(#cyanSheen)" stroke="#e0f2fe" stroke-width="1.2"/>
      <text x="140" y="202" font-family="'Cinzel', serif" font-size="16" font-weight="900" fill="#0369a1" text-anchor="middle">♞</text>
    </g>

    <!-- Capture Target Beacon (Red Pulsing Radar Rings) -->
    <circle cx="320" cy="190" r="6" fill="#ef4444"/>
    <circle class="beacon-ring" cx="320" cy="190" r="16" fill="none" stroke="#ef4444"/>
    <text x="320" y="170" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" fill="#f87171" text-anchor="middle">FORK [B4]</text>
  </g>

  <!-- TYPOGRAPHY & IDENTITY TIER -->
  <g transform="translate(530, 60)">
    <!-- Brand Title with 3D Depth Shadow -->
    <text x="0" y="46" font-family="'Cinzel', 'Times New Roman', serif" font-size="44" font-weight="900" fill="#0f172a" letter-spacing="3">GRANDMASTER-AI</text>
    <text x="-2" y="44" font-family="'Cinzel', 'Times New Roman', serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="3">GRANDMASTER-AI</text>

    <!-- Subtitle & Engineering Identity -->
    <text x="0" y="80" font-family="'Inter', sans-serif" font-size="17" font-weight="600" fill="#38bdf8">Adversarial Minimax • Alpha-Beta Pruning • Quiescence Engine</text>
    <text x="0" y="108" font-family="'Inter', sans-serif" font-size="13.5" fill="#94a3b8">Interactive 3D WebGL Arena • Dual-Persona Usability • Zero-Cost Cloud Deployment</text>

    <!-- Interactive Metric Badges -->
    <g transform="translate(0, 140)">
      <!-- Metric 1: Heuristic -->
      <rect width="135" height="34" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
      <circle cx="16" cy="17" r="4.5" fill="#10b981"/>
      <text x="28" y="22" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#10b981">PeSTO PST (MG/EG)</text>

      <!-- Metric 2: Search Depth -->
      <g transform="translate(147, 0)">
        <rect width="130" height="34" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
        <circle cx="16" cy="17" r="4.5" fill="#38bdf8"/>
        <text x="28" y="22" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#38bdf8">α-β PRUNING</text>
      </g>

      <!-- Metric 3: 3D Engine -->
      <g transform="translate(289, 0)">
        <rect width="125" height="34" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
        <circle cx="16" cy="17" r="4.5" fill="#fbbf24"/>
        <text x="28" y="22" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#fbbf24">THREE.JS 3D</text>
      </g>

      <!-- Metric 4: Design Tokens -->
      <g transform="translate(426, 0)">
        <rect width="140" height="34" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
        <circle cx="16" cy="17" r="4.5" fill="#a855f7"/>
        <text x="28" y="22" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#a855f7">GOOGLE STITCH</text>
      </g>
    </g>

    <!-- Real-Time Evaluation Status Bar -->
    <g transform="translate(0, 195)">
      <rect width="566" height="58" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
      <text x="18" y="26" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#94a3b8">ENGINE EVALUATION HUD</text>
      <text x="548" y="26" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#10b981" text-anchor="end">+1.85 CP (WHITE ADVANTAGE)</text>
      <!-- Progress Bar Track -->
      <rect x="18" y="36" width="530" height="8" rx="4" fill="#334155"/>
      <rect x="18" y="36" width="360" height="8" rx="4" fill="url(#emeraldSheen)"/>
      <circle cx="378" cy="40" r="6" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
    </g>

    <!-- Engineering Verification Footer -->
    <g transform="translate(0, 280)">
      <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="11.5" fill="#64748b">
        ✓ 36/36 Test Suite Passed (Exit Code 0)  •  Zobrist Transposition Table  •  Author: @Ayushnot41
      </text>
    </g>
  </g>
</svg>
