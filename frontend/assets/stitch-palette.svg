<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="320">
  <defs>
    <style>
      @keyframes swatchGlow {
        0% { filter: drop-shadow(0 0 4px rgba(255,255,255,0.1)); }
        50% { filter: drop-shadow(0 0 14px rgba(255,255,255,0.3)); }
        100% { filter: drop-shadow(0 0 4px rgba(255,255,255,0.1)); }
      }
      .palette-card { animation: swatchGlow 4s ease-in-out infinite; }
    </style>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
  </defs>

  <!-- Container Surface -->
  <rect width="1000" height="320" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Section Header -->
  <g transform="translate(32, 38)">
    <text font-family="'Cinzel', serif" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="1.5">GOOGLE STITCH DESIGN SYSTEM • COLOR TOKENS</text>
    <text y="22" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">24-Step Spatial Architecture • WCAG 2.1 AA Contrast Ratio • HSL Kinetic Micro-interactions</text>
  </g>

  <!-- Color Swatches Grid (Row 1) -->
  <!-- Token 1: Obsidian Canvas -->
  <g transform="translate(32, 90)">
    <rect width="220" height="90" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.2" />
    <rect x="12" y="12" width="66" height="66" rx="8" fill="#070a14" stroke="#334155" stroke-width="1.5" />
    <text x="90" y="34" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#ffffff">--bg-canvas</text>
    <text x="90" y="52" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38bdf8">#070a14</text>
    <text x="90" y="68" font-family="'Inter', sans-serif" font-size="10" fill="#64748b">Deep Obsidian</text>
  </g>

  <!-- Token 2: Surface Glass -->
  <g transform="translate(272, 90)">
    <rect width="220" height="90" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.2" />
    <rect x="12" y="12" width="66" height="66" rx="8" fill="#121826" stroke="#334155" stroke-width="1.5" />
    <text x="90" y="34" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#ffffff">--bg-surface</text>
    <text x="90" y="52" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38bdf8">#121826</text>
    <text x="90" y="68" font-family="'Inter', sans-serif" font-size="10" fill="#64748b">HUD Glass Backdrop</text>
  </g>

  <!-- Token 3: Emerald Success -->
  <g transform="translate(512, 90)">
    <rect width="220" height="90" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.2" />
    <rect x="12" y="12" width="66" height="66" rx="8" fill="#10b981" />
    <text x="90" y="34" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#ffffff">--accent-emerald</text>
    <text x="90" y="52" font-family="'JetBrains Mono', monospace" font-size="11" fill="#10b981">#10b981</text>
    <text x="90" y="68" font-family="'Inter', sans-serif" font-size="10" fill="#64748b">Best Move / Win</text>
  </g>

  <!-- Token 4: Cyan Tactics -->
  <g transform="translate(752, 90)">
    <rect width="216" height="90" rx="10" fill="#0f172a" stroke="#06b6d4" stroke-width="1.2" />
    <rect x="12" y="12" width="66" height="66" rx="8" fill="#06b6d4" />
    <text x="90" y="34" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#ffffff">--accent-cyan</text>
    <text x="90" y="52" font-family="'JetBrains Mono', monospace" font-size="11" fill="#06b6d4">#06b6d4</text>
    <text x="90" y="68" font-family="'Inter', sans-serif" font-size="10" fill="#64748b">Excellent Move</text>
  </g>

  <!-- Color Swatches Grid (Row 2) -->
  <!-- Token 5: Amber Alert -->
  <g transform="translate(32, 198)">
    <rect width="220" height="90" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2" />
    <rect x="12" y="12" width="66" height="66" rx="8" fill="#f59e0b" />
    <text x="90" y="34" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#ffffff">--accent-amber</text>
    <text x="90" y="52" font-family="'JetBrains Mono', monospace" font-size="11" fill="#f59e0b">#f59e0b</text>
    <text x="90" y="68" font-family="'Inter', sans-serif" font-size="10" fill="#64748b">Turn / Kid Mode</text>
  </g>

  <!-- Token 6: Ruby Danger -->
  <g transform="translate(272, 198)">
    <rect width="220" height="90" rx="10" fill="#0f172a" stroke="#ef4444" stroke-width="1.2" />
    <rect x="12" y="12" width="66" height="66" rx="8" fill="#ef4444" />
    <text x="90" y="34" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#ffffff">--accent-ruby</text>
    <text x="90" y="52" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ef4444">#ef4444</text>
    <text x="90" y="68" font-family="'Inter', sans-serif" font-size="10" fill="#64748b">Capture / Check</text>
  </g>

  <!-- Token 7: Primary Blue -->
  <g transform="translate(512, 198)">
    <rect width="220" height="90" rx="10" fill="#0f172a" stroke="#2563eb" stroke-width="1.2" />
    <rect x="12" y="12" width="66" height="66" rx="8" fill="#2563eb" />
    <text x="90" y="34" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#ffffff">--accent-primary</text>
    <text x="90" y="52" font-family="'JetBrains Mono', monospace" font-size="11" fill="#60a5fa">#2563eb</text>
    <text x="90" y="68" font-family="'Inter', sans-serif" font-size="10" fill="#64748b">Interactive Action</text>
  </g>

  <!-- Token 8: Royal Purple -->
  <g transform="translate(752, 198)">
    <rect width="216" height="90" rx="10" fill="#0f172a" stroke="#a855f7" stroke-width="1.2" />
    <rect x="12" y="12" width="66" height="66" rx="8" fill="#a855f7" />
    <text x="90" y="34" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#ffffff">--accent-purple</text>
    <text x="90" y="52" font-family="'JetBrains Mono', monospace" font-size="11" fill="#c084fc">#a855f7</text>
    <text x="90" y="68" font-family="'Inter', sans-serif" font-size="10" fill="#64748b">Stitch Brand Identity</text>
  </g>
</svg>
